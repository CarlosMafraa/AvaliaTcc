<div class="flex flex-column h-full menu">
  <div class="flex flex-column align-items-center justify-content-center mt-5">
    <img ngSrc="assets/login/icon_tcc.png" width="75" height="75" alt="Ícone do TCC" class="img1"
         priority>
    <p class="text-xl text">Avalia Tcc</p>
  </div>
  <div class="h-full px-3 py-1">
    @for (item of itens; track item) {

      <div class="my-2">
        <app-menu-item [icon]="item.icon" [name]="item.name"
                       (click)="item.action ? handleAction(item.action) : navigate(item.route)"></app-menu-item>
      </div>
    }
  </div>
</div>
