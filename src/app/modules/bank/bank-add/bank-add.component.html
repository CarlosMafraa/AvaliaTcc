<form [formGroup]="formGroup" class="flex flex-column" (ngSubmit)="salve()">
  <div>
  <p-floatlabel variant="on">
    <p-multiselect
      appendTo="body"
      [options]="professores"
      formControlName="banca"
      optionLabel="nome"
      display="chip"
      styleClass="w-full my-4" />
    <label>Selecione a banca</label>
  </p-floatlabel>
    <div class="card flex justify-center">
    </div>
  </div>
  <div class="flex justify-content-end gap-2 my-2">
    <div>
      <p-button label="Cancelar" severity="danger" (click)="closeDialog()">
        <span class="material-symbols-outlined">
          cancel
        </span>
      </p-button>
    </div>
    <div>
      <p-button label="Salvar" type="submit">
        <span class="material-symbols-outlined">
          save
        </span>
      </p-button>
    </div>
  </div>
</form>
