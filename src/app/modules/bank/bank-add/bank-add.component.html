<form [formGroup]="formGroup" class="flex flex-column" (ngSubmit)="save()">
  <div class="my-2">
    <p-floatlabel variant="on">
      <p-inputnumber inputId="minmaxfraction"
                     mode="decimal"
                     [minFractionDigits]="2"
                     [maxFractionDigits]="2"
                     [min]="0"
                     [max]="2"
                     autocomplete="off"
                     formControlName="nota1"
                     class="w-full" />

      <label>Clareza e Estrutura</label>
    </p-floatlabel>
  </div>
  <div class="my-2">
    <p-floatlabel variant="on">
      <p-inputnumber inputId="minmaxfraction"
                     mode="decimal"
                     [minFractionDigits]="2"
                     [maxFractionDigits]="2"
                     [min]="0"
                     [max]="2"
                     autocomplete="off"
                     formControlName="nota2"
                     class="w-full" />
      <label>Profundidade da Pesquisa</label>
    </p-floatlabel>
  </div>
  <div class="my-2">
    <p-floatlabel variant="on">
      <p-inputnumber inputId="minmaxfraction"
                     mode="decimal"
                     [minFractionDigits]="2"
                     [maxFractionDigits]="2"
                     [min]="0"
                     [max]="2"
                     autocomplete="off"
                     formControlName="nota3"
                     class="w-full" />
      <label>Metodologia</label>
    </p-floatlabel>
  </div>
  <div class="my-2">
    <p-floatlabel variant="on">
      <p-inputnumber inputId="minmaxfraction"
                     mode="decimal"
                     [minFractionDigits]="2"
                     [maxFractionDigits]="2"
                     [min]="0"
                     [max]="2"
                     autocomplete="off"
                     formControlName="nota4"
                     class="w-full" />
      <label>Análise e Resultados</label>
    </p-floatlabel>
  </div>
  <div class="my-2">
    <p-floatlabel variant="on">
      <p-inputnumber inputId="minmaxfraction"
                     mode="decimal"
                     [minFractionDigits]="2"
                     [maxFractionDigits]="2"
                     [min]="0"
                     [max]="2"
                     autocomplete="off"
                     formControlName="nota5"
                     class="w-full" />
      <label>Apresentação e Defesa</label>
    </p-floatlabel>
  </div>
  <div class="my-2">
    <p-floatlabel variant="on">
      <textarea rows="5" cols="30" autocomplete="off" formControlName="comentario"
                class="w-full" pTextarea></textarea>
      <label>Comentário</label>
    </p-floatlabel>
  </div>
  <div class="flex justify-content-end gap-2 my-2">
    <div>
      <p-button label="Cancelar" severity="danger" (click)="closeDialog()">
        <span class="material-symbols-outlined">
          cancel
        </span>
      </p-button>
    </div>
    <div>
      <p-button label="Assinar" type="submit">
        <span class="material-symbols-outlined">
          save
        </span>
      </p-button>
    </div>
  </div>
</form>
