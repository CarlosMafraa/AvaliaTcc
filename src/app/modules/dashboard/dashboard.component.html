<div class="flex flex-column">
  <div class="flex justify-content-between align-items-center">
    <div>
      <p class="font-bold text-3xl">Listagem de Tcc</p>
    </div>
    <div>
      <p-button label="Adicionar" (click)="openDialog()">
        <span class="material-symbols-outlined">
          add_circle
        </span>
      </p-button>
    </div>
  </div>
  <div>
    @for (tcc of listTcc; track tcc) {
      <app-information [tcc_id]="tcc.id"
                       [titulo]="tcc.titulo"
                       [descricao]="tcc.descricao"
                       [pdfUrl]="tcc.pdf"
                       [banca_id]="tcc.banca_id"
                       [orientador_id]="tcc.orientador_id"
                       [tcc_media] = tcc.media
                       (refreshEmitter)="this.getTccUser(this.user_id)"
      ></app-information>
    }
  </div>
</div>


<p-dialog header="Informações do TCC" [modal]="true"
          [(visible)]="dialog"
          [style]="{ width: '50rem' }"
          (onHide)="closeDialog()">
  <app-dashboard-add (closeDialogEmitter)="closeDialog()"></app-dashboard-add>
</p-dialog>
