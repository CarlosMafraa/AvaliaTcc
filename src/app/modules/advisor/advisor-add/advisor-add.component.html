<form [formGroup]="formGroup" class="flex flex-column" (ngSubmit)="save()">
  <div>
    <p-floatlabel variant="on" class="my-2">
      <p-multiselect
        appendTo="body"
        [options]="professores"
        formControlName="banca"
        optionLabel="nome"
        optionValue="id"
        display="chip"
        styleClass="w-full" />
      <label>Selecione a banca</label>
    </p-floatlabel>
    <div class="card flex justify-center">
    </div>
  </div>
  <div class="flex justify-content-end gap-2 my-2">
    <div>
      <p-button label="Cancelar" severity="danger" (click)="closeDialog()">
        <span class="material-symbols-outlined">
          cancel
        </span>
      </p-button>
    </div>
    <div>
      <p-button label="Salvar" type="submit">
        <span class="material-symbols-outlined">
          save
        </span>
      </p-button>
    </div>
  </div>
</form>
